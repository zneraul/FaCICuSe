name: FaCICuSe Preview Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/homepage-routing-authenticated-navigation-main

permissions:
  contents: read

concurrency:
  group: facicuse-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run domain and authentication regression tests
        run: npm test
      - name: Build frontend
        run: npm run build
